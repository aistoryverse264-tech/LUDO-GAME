<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Ludo</title>
<style>
:root{--bg:#f6f3ec;--fg:#1c1b19;--card:#fff;--line:#d9d3c5;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--fg:#eee;--card:#25252a;--line:#3a3a42;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17171a;--fg:#eee;--card:#25252a;--line:#3a3a42;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,-apple-system,Segoe UI,sans-serif}
body{min-height:100%}main{max-width:560px;margin:0 auto;padding:12px}
[hidden]{display:none!important}h1,h2{text-align:center;margin:.4em 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
button,select,input{font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
button{cursor:pointer;background:#2b6cb0;color:#fff;border:0;font-weight:600}button:disabled{opacity:.45}
button.sec{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}input{text-transform:uppercase}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
#turn{font-weight:700;display:flex;align-items:center;gap:8px}#turn i{width:18px;height:18px;border-radius:50%;display:inline-block;border:2px solid var(--fg)}
#dice{width:72px;height:72px;font-size:2.8rem;line-height:1;padding:0;background:var(--card);color:var(--fg);border:2px solid var(--line)}
#dice.on{border-color:#2b6cb0;animation:b .8s infinite}@keyframes b{50%{transform:scale(1.08)}}
svg{width:100%;height:auto;display:block;touch-action:manipulation}
.pc{transition:transform .28s ease;cursor:pointer}.pc circle{transform-box:fill-box;transform-origin:center}
.pc.mv circle:first-child{animation:p .7s infinite}@keyframes p{50%{transform:scale(1.28)}}
#log{text-align:center;min-height:1.4em;margin:8px 0}
#win{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px}
#win .card{max-width:340px;width:100%;text-align:center}
</style></head><body><main><section id="menu"><h1>🎲 Ludo</h1><div class="card"><input id="nm" maxlength="12" placeholder="Aap ka naam" style="text-transform:none">
<button onclick="find('duel')">1 vs 1 Duel</button><button onclick="find('classic')">Classic (4 khiladi)</button>
<button class="sec" onclick="mk()">Dosto ka room banao</button><div class="row"><input id="code" maxlength="4" placeholder="Room code"><button onclick="jn()">Room mein jao</button></div></div></section>
<section id="lobby" hidden><h2 id="lt"></h2><div class="card"><p id="lp" style="margin:0;text-align:center"></p><button id="go" hidden onclick="sock.emit('start')">Khel shuru karo</button><button class="sec" onclick="location.reload()">Wapas</button></div></section>
<section id="game" hidden><div class="bar"><div id="turn"></div><button id="dice" onclick="rollClick()">🎲</button></div>
<svg id="bd" viewBox="0 0 15 15"></svg><div id="log"></div>
<div id="win" hidden><div class="card"><h2>Khel khatam 🏆</h2><div id="rank"></div><button id="again" onclick="again()">Dobara khelo</button><button class="sec" onclick="location.reload()">Menu</button></div></div></section>
</main><script src="/socket.io/socket.io.js"></script><script src="engine.js"></script><script>
const $=id=>document.getElementById(id),COL=['#e53935','#43a047','#fdd835','#1e88e5'],F=['⚀','⚁','⚂','⚃','⚄','⚅'];
let S=null,mode='off',host=false,me=Math.random().toString(36).slice(2,8),myC=[],R=null,seat={},tm,hi;
const show=id=>['menu','lobby','game'].forEach(x=>$(x).hidden=x!=id);
/* ---- board ---- */
const xy=(c,i,p)=>p==0?[YO[c][0]+1.5+2*(i>>1),YO[c][1]+1.5+2*(i&1)]:p<52?T[(ST[c]+p-1)%52]:p<57?HC[p-52][c]:[[7,6.2],[6.2,7],[7,7.8],[7.8,7]][c];
const cell=(r,c,f)=>`<rect x="${c}" y="${r}" width="1" height="1" fill="${f}" stroke="var(--line)" stroke-width=".05"/>`;
function build(){let h='';YO.forEach((o,c)=>h+=`<rect x="${o[1]}" y="${o[0]}" width="6" height="6" fill="${COL[c]}" rx=".4"/><rect x="${o[1]+1}" y="${o[0]+1}" width="4" height="4" fill="var(--card)" rx=".4"/>`);
 for(let r=0;r<15;r++)for(let c=0;c<15;c++)if(((r>5&&r<9)||(c>5&&c<9))&&!(r>5&&r<9&&c>5&&c<9))h+=cell(r,c,'var(--card)');
 for(let c=0;c<4;c++){for(let k=0;k<5;k++)h+=cell(...HC[k][c],COL[c]);h+=cell(...T[ST[c]],COL[c]);const s=T[ST[c]+8];h+=`<text x="${s[1]+.5}" y="${s[0]+.75}" font-size=".7" text-anchor="middle" fill="var(--fg)">★</text>`}
 h+=`<polygon points="6,9 6,6 7.5,7.5" fill="${COL[0]}"/><polygon points="6,6 9,6 7.5,7.5" fill="${COL[1]}"/><polygon points="9,6 9,9 7.5,7.5" fill="${COL[2]}"/><polygon points="9,9 6,9 7.5,7.5" fill="${COL[3]}"/>`;
 for(let c=0;c<4;c++)for(let i=0;i<4;i++)h+=`<g class="pc" id="p${c}${i}" style="transform:translate(0,0)"><circle r=".36" fill="${COL[c]}" stroke="#111" stroke-width=".07"/><circle r=".12" cy="-.1" fill="#fff" opacity=".6"/></g>`;
 $('bd').innerHTML=h;for(let c=0;c<4;c++)for(let i=0;i<4;i++)$('p'+c+i).onclick=()=>{if(S&&c==S.t&&own(c)&&S.d&&mv(S,S.d).includes(i))act('m',i)}}
const own=c=>mode=='off'?S.k[c]=='h':myC.includes(c);
function render(){if(!S)return;const g={};
 for(let c=0;c<4;c++)for(let i=0;i<4;i++){const[r,q]=xy(c,i,S.pos[c][i]),k=r+','+q;(g[k]=g[k]||[]).push([c,i,r,q])}
 const ms=!S.over&&S.d&&own(S.t)?mv(S,S.d):[];
 for(const k in g){const L=g[k];L.forEach(([c,i,r,q],n)=>{const e=$('p'+c+i),m=L.length>1,dx=m?(n%2?.2:-.2):0,dy=m?((n>>1)&1?.2:-.2):0;
  e.style.transform=`translate(${q+.5+dx}px,${r+.5+dy}px) scale(${m?.7:1})`;e.classList.toggle('mv',c==S.t&&ms.includes(i))})}
 const c=S.t,can=!S.over&&!S.d&&own(c);
 $('turn').innerHTML=S.over?'Khel khatam':`<i style="background:${COL[c]}"></i>${NM[c]} ki baari`;
 $('dice').textContent=S.ld?F[S.ld-1]:'🎲';$('dice').disabled=!can;$('dice').classList.toggle('on',can);$('log').textContent=S.log;
 $('win').hidden=!S.over;if(S.over){$('rank').innerHTML=S.won.map((x,n)=>`<p><b>${n+1}.</b> <span style="color:${COL[x]}">●</span> ${NM[x]}</p>`).join('');$('again').hidden=mode=='on'&&!host}}
mode='on';
const sock=io(),nm=()=>$('nm').value.trim()||'Khiladi';
function wait(t){show('lobby');$('lt').textContent='Intezar...';$('lp').textContent=t;$('go').hidden=true}
function find(m){sock.emit('find',{mode:m,name:nm()});wait('Khiladi dhoondh rahe hain (8 second baad computer bhar denge)...')}
function mk(){sock.emit('make',{name:nm()})}
function jn(){sock.emit('join',{code:$('code').value.trim().toUpperCase(),name:nm()})}
function act(t,i){sock.emit('move',i)}
function rollClick(){if(S&&!S.d&&own(S.t))sock.emit('roll')}
sock.on('room',d=>{myC=[d.seat];if(S&&S.over)return;if(!S)show('lobby');$('lt').textContent='Room: '+d.code;$('lp').textContent='Aap '+NM[d.seat]+' hain. Khiladi: '+d.names.join(', ');$('go').hidden=!d.host||d.started});
sock.on('state',s=>{S=s;show('game');if(!$('p00'))build();render()});
sock.on('err',t=>alert(t));
sock.on('disconnect',()=>alert('Server se rabta toot gaya'));
</script></body></html>
